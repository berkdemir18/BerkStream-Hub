name: Build BerkStream and update catalog

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: berkstream-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vendor all upstream sources into BerkStream
        run: |
          set -euo pipefail
          npm run vendor
          node -e "const r=require('./vendor-report.json'); if (r.vendoredCount < 40) { console.error('Beklenenden az kaynak gomuldu: '+r.vendoredCount); process.exit(1); }"

      - name: Build custom provider
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson ensureJarCompatibility

      - name: Bundle closed-source PLT engine
        run: |
          set -euo pipefail
          # PLT'nin dex'i hazir derlenmis geliyor ve d8 onu yeniden islerken
          # desugar uyarisi veriyor. Kurulum hatasi arastirilirken bu adim
          # sources.json'daki bayrakla kapatilabiliyor.
          if [ "$(node -p "require('./sources.json').bundlePltEngine === true")" != "true" ]; then
            echo "PLT dex birlestirme kapali (sources.json: bundlePltEngine=false)."
            exit 0
          fi
          temp_dir="$(mktemp -d)"
          curl -fsSL "https://raw.githubusercontent.com/pltmustafa/plt-stream/builds/plt-stream.cs3" -o "$temp_dir/plt-stream.cs3"
          mkdir -p "$temp_dir/berk" "$temp_dir/plt" "$temp_dir/merged"
          unzip -q BerkStream/build/BerkStream.cs3 -d "$temp_dir/berk"
          unzip -q -o "$temp_dir/plt-stream.cs3" 'classes*.dex' -d "$temp_dir/plt"
          d8_path="$(find "$ANDROID_HOME/build-tools" -type f -name d8 | sort -V | tail -1)"
          "$d8_path" --min-api 21 --output "$temp_dir/merged" "$temp_dir"/berk/classes*.dex "$temp_dir"/plt/classes*.dex
          rm -f "$temp_dir"/berk/classes*.dex
          cp "$temp_dir"/merged/classes*.dex "$temp_dir/berk/"
          echo "Birlesik dex dosyalari:"
          ls -la "$temp_dir/berk"
          rm -f BerkStream/build/BerkStream.cs3
          (cd "$temp_dir/berk" && zip -qr "$GITHUB_WORKSPACE/BerkStream/build/BerkStream.cs3" .)

      - name: Build and verify merged catalog
        env:
          BERKSTREAM_REPOSITORY: ${{ github.repository }}
          BERKSTREAM_BRANCH: builds
          BERKSTREAM_LOCAL_PLUGIN_MANIFEST: ${{ github.workspace }}/build/plugins.json
          BERKSTREAM_LOCAL_BUILD_DIR: ${{ github.workspace }}/BerkStream/build
          BERKSTREAM_OUTPUT_DIR: ${{ github.workspace }}/publish
        run: npm run verify

      - name: Add custom packages
        run: |
          cp BerkStream/build/*.cs3 publish/
          find BerkStream/build -maxdepth 1 -name '*.jar' -exec cp {} publish/ \;

      - name: Publish builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
