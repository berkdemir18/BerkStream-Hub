name: Build BerkStream and update catalog

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: berkstream-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build custom provider
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson ensureJarCompatibility

      - name: Build and verify merged catalog
        env:
          BERKSTREAM_REPOSITORY: ${{ github.repository }}
          BERKSTREAM_BRANCH: builds
          BERKSTREAM_LOCAL_PLUGIN_MANIFEST: ${{ github.workspace }}/build/plugins.json
          BERKSTREAM_LOCAL_BUILD_DIR: ${{ github.workspace }}/BerkStream/build
          BERKSTREAM_OUTPUT_DIR: ${{ github.workspace }}/publish
        run: npm run verify

      - name: Add custom packages
        run: |
          cp BerkStream/build/*.cs3 publish/
          find BerkStream/build -maxdepth 1 -name '*.jar' -exec cp {} publish/ \;

      - name: Publish builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
