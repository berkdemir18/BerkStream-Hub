name: Build BerkStream and update catalog

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: berkstream-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Varsayilan olarak `sdkmanager tools` calistiriliyor; Google o eski
          # paketi depodan kaldirdi ve adim "Failed to find package 'tools'"
          # deyip patliyor (2026-09-19). Calistirici imajinda Android SDK ve
          # platform-tools zaten kurulu, tek ihtiyacimiz ANDROID_HOME'un
          # ayarlanmasi -- bos liste verince adim sdkmanager'i hic cagirmiyor.
          packages: ''

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vendor all upstream sources into BerkStream
        run: |
          set -euo pipefail
          npm run vendor
          node -e "const r=require('./vendor-report.json'); if (r.vendoredCount < 40) { console.error('Beklenenden az kaynak gomuldu: '+r.vendoredCount); process.exit(1); }"

      - name: Build custom provider
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson ensureJarCompatibility

      - name: Build and verify merged catalog
        env:
          BERKSTREAM_REPOSITORY: ${{ github.repository }}
          BERKSTREAM_BRANCH: builds
          BERKSTREAM_LOCAL_PLUGIN_MANIFEST: ${{ github.workspace }}/build/plugins.json
          BERKSTREAM_LOCAL_BUILD_DIR: ${{ github.workspace }}/BerkStream/build
          BERKSTREAM_OUTPUT_DIR: ${{ github.workspace }}/publish
        run: npm run verify

      - name: Scan source domains and publish address list
        env:
          BERKSTREAM_OUTPUT_DIR: ${{ github.workspace }}/publish
        run: node scripts/check-domains.mjs

      - name: Add custom packages
        run: |
          cp BerkStream/build/*.cs3 publish/
          find BerkStream/build -maxdepth 1 -name '*.jar' -exec cp {} publish/ \;

      - name: Publish builds branch
        # Deneme dallari yalnizca derlenir; TV'lerin cektigi builds dalina
        # sadece ana daldan yayin gider.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
